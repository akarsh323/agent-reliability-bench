[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reliabench"
version = "0.1.0"
description = "Reliability study for tool-using agents: tool faults, indirect prompt injection, and defenses, built on Inspect AI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "akarsh323" }]
keywords = ["agents", "ai-safety", "evals", "inspect-ai", "llm", "prompt-injection", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "inspect-ai>=0.3.289,<0.4",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/akarsh323/agent-reliability-bench"
Issues = "https://github.com/akarsh323/agent-reliability-bench/issues"

[project.scripts]
reliabench = "reliabench.cli:main"

[project.entry-points.inspect_ai]
reliabench = "reliabench._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/reliabench"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/reliabench"]

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: runs the full Inspect pipeline with the scripted reference agents"]

[tool.coverage.run]
branch = true
source = ["reliabench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
